# Template for k8s/secrets.yaml — copy to secrets.yaml and fill in real values.
# The real secrets.yaml is gitignored and must never be committed.
#
#   cp k8s/secrets.example.yaml k8s/secrets.yaml
#   # then replace every REPLACE_ME below with real values
#
apiVersion: v1
kind: Secret
metadata:
  name: pulsewatch-db-credentials
  namespace: pulsewatch
type: Opaque
stringData:
  POSTGRES_USER: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: pulsewatch-app-secrets
  namespace: pulsewatch
type: Opaque
stringData:
  # Long random string, e.g. `openssl rand -hex 32`
  JWT_SECRET: REPLACE_ME
  # postgresql://<POSTGRES_USER>:<POSTGRES_PASSWORD>@postgres:5432/<POSTGRES_DB>
  DATABASE_URL: REPLACE_ME
