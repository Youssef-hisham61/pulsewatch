apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pulsewatch
spec:
  # replica count is managed by the HorizontalPodAutoscaler (see api-hpa.yaml)
  selector:
    matchLabels:
      app: pulsewatch
      component: api
  template:
    metadata:
      labels:
        app: pulsewatch
        component: api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: pulsewatch
                    component: api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: yh61/pulsewatch-images-docker-repo:api-1.0.8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulsewatch-app-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pulsewatch-app-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              value: "7d"
            - name: NODE_ENV
              value: development
            - name: LOG_LEVEL
              value: info
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pulsewatch
spec:
  selector:
    app: pulsewatch
    component: api
  ports:
    - port: 80
      targetPort: 3000
