apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pulsewatch-gateway
  namespace: pulsewatch
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pulsewatch-api
  namespace: pulsewatch
spec:
  parentRefs:
    - name: pulsewatch-gateway
  rules:
    - backendRefs:
        - name: api
          port: 80
