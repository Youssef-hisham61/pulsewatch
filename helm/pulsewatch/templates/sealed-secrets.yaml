{{- if .Values.secrets.sealed }}
# SealedSecrets: encrypted secrets, safe to commit publicly. The in-cluster
# sealed-secrets controller decrypts them into the Secrets the app references.
# Strict scope: bound to name + namespace (pulsewatch). Re-seal for other namespaces.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pulsewatch-db-credentials
  namespace: pulsewatch
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: pulsewatch-db-credentials
      namespace: pulsewatch
    type: Opaque
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pulsewatch-app-secrets
  namespace: pulsewatch
spec:
  encryptedData:
    DATABASE_URL: 
    JWT_SECRET: 
  template:
    metadata:
      name: pulsewatch-app-secrets
      namespace: pulsewatch
    type: Opaque
{{- end }}
