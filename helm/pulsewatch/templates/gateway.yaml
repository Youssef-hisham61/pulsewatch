apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pulsewatch-gateway
  labels:
    app: pulsewatch
    {{- include "pulsewatch.commonLabels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pulsewatch-api
  labels:
    app: pulsewatch
    {{- include "pulsewatch.commonLabels" . | nindent 4 }}
spec:
  parentRefs:
    - name: pulsewatch-gateway
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: api
          port: {{ .Values.api.service.port }}
